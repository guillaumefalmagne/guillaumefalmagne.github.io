<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-labelledby="t d">
  <title id="t">Polycentric cooperation network</title>
  <desc id="d">A central institution linked to three regional institutions, which are also linked to each other (in red); each regional institution anchors a community of connected people.</desc>
  <defs>
    <!-- classical building glyph -->
    <symbol id="inst" viewBox="0 0 40 40">
      <polygon points="3,14 20,4 37,14" fill="#0d3b22"/>
      <rect x="5" y="15" width="30" height="3" rx="0.6" fill="#0d3b22"/>
      <rect x="8"  y="19.5" width="3.2" height="12" fill="#0d3b22"/>
      <rect x="15" y="19.5" width="3.2" height="12" fill="#0d3b22"/>
      <rect x="21.8" y="19.5" width="3.2" height="12" fill="#0d3b22"/>
      <rect x="28.8" y="19.5" width="3.2" height="12" fill="#0d3b22"/>
      <rect x="4" y="32.5" width="32" height="3.5" rx="0.6" fill="#0d3b22"/>
    </symbol>
    <!-- person glyph -->
    <symbol id="person" viewBox="0 0 40 40">
      <circle cx="20" cy="14" r="7" fill="#fff"/>
      <path d="M7 34c0-7.5 5.8-12 13-12s13 4.5 13 12z" fill="#fff"/>
    </symbol>
    <radialGradient id="community" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#e2efe7" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#e2efe7" stop-opacity=".35"/>
    </radialGradient>
    <radialGradient id="instFill" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d4e7da"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0d3b22" flood-opacity=".18"/>
    </filter>
  </defs>

  <!-- communities -->
  <g stroke="#046c34" stroke-width="1.5" fill="url(#community)">
    <ellipse cx="150" cy="420" rx="118" ry="92"/>
    <ellipse cx="400" cy="448" rx="110" ry="80"/>
    <ellipse cx="650" cy="420" rx="118" ry="92"/>
  </g>

  <!-- vertical (hierarchical) links -->
  <g stroke="#046c34" stroke-width="3" stroke-linecap="round" fill="none">
    <line x1="400" y1="78" x2="185" y2="190"/>
    <line x1="400" y1="78" x2="400" y2="232"/>
    <line x1="400" y1="78" x2="615" y2="190"/>
    <line x1="182" y1="214" x2="160" y2="328"/>
    <line x1="400" y1="258" x2="400" y2="368"/>
    <line x1="618" y1="214" x2="640" y2="328"/>
  </g>

  <!-- horizontal (polycentric) links between regional institutions -->
  <g stroke="#cd0f0f" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="210" y1="192" x2="590" y2="192"/>
    <line x1="206" y1="204" x2="376" y2="240"/>
    <line x1="594" y1="204" x2="424" y2="240"/>
  </g>

  <!-- links within communities -->
  <g stroke="#046c34" stroke-width="2" stroke-linecap="round" opacity=".85">
    <line x1="105" y1="385" x2="190" y2="378"/>
    <line x1="105" y1="385" x2="118" y2="462"/>
    <line x1="105" y1="385" x2="200" y2="455"/>
    <line x1="190" y1="378" x2="118" y2="462"/>
    <line x1="118" y1="462" x2="200" y2="455"/>

    <line x1="400" y1="400" x2="340" y2="478"/>
    <line x1="400" y1="400" x2="460" y2="478"/>
    <line x1="340" y1="478" x2="460" y2="478"/>

    <line x1="640" y1="365" x2="595" y2="430"/>
    <line x1="640" y1="365" x2="705" y2="408"/>
    <line x1="640" y1="365" x2="672" y2="476"/>
    <line x1="595" y1="430" x2="672" y2="476"/>
    <line x1="705" y1="408" x2="672" y2="476"/>
  </g>

  <!-- people -->
  <g filter="url(#soft)">
    <g fill="#2f8f57">
      <circle cx="105" cy="385" r="22"/><circle cx="190" cy="378" r="22"/>
      <circle cx="118" cy="462" r="22"/><circle cx="200" cy="455" r="22"/>
      <circle cx="400" cy="400" r="22"/><circle cx="340" cy="478" r="22"/><circle cx="460" cy="478" r="22"/>
      <circle cx="640" cy="365" r="22"/><circle cx="595" cy="430" r="22"/>
      <circle cx="705" cy="408" r="22"/><circle cx="672" cy="476" r="22"/>
    </g>
    <g>
      <use href="#person" x="89"  y="369" width="32" height="32"/>
      <use href="#person" x="174" y="362" width="32" height="32"/>
      <use href="#person" x="102" y="446" width="32" height="32"/>
      <use href="#person" x="184" y="439" width="32" height="32"/>
      <use href="#person" x="384" y="384" width="32" height="32"/>
      <use href="#person" x="324" y="462" width="32" height="32"/>
      <use href="#person" x="444" y="462" width="32" height="32"/>
      <use href="#person" x="624" y="349" width="32" height="32"/>
      <use href="#person" x="579" y="414" width="32" height="32"/>
      <use href="#person" x="689" y="392" width="32" height="32"/>
      <use href="#person" x="656" y="460" width="32" height="32"/>
    </g>
  </g>

  <!-- institutions -->
  <g filter="url(#soft)" stroke="#046c34" stroke-width="2" fill="url(#instFill)">
    <ellipse cx="400" cy="62" rx="58" ry="40"/>
    <ellipse cx="185" cy="194" rx="38" ry="27"/>
    <ellipse cx="400" cy="244" rx="38" ry="27"/>
    <ellipse cx="615" cy="194" rx="38" ry="27"/>
  </g>
  <use href="#inst" x="372" y="34" width="56" height="56"/>
  <use href="#inst" x="167" y="176" width="36" height="36"/>
  <use href="#inst" x="382" y="226" width="36" height="36"/>
  <use href="#inst" x="597" y="176" width="36" height="36"/>
</svg>
